    const spr = (damping = 10, stiffness = 100, mass = 1, dur = 1) => {

      return (p) => {

        if (z < 1) return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));

      };
