  <script>
    (function () {

      var tl = gsap.timeline({ paused: true });
      // Remotion-style spring (mass 1): z = damping ratio, w = natural freq, T = seconds the tween spans
      function spring(z, w, T) {
        var wd = w * Math.sqrt(1 - z * z), a = z * w;

          var st = Math.floor(tl.time() * 6);
