      #streak { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; opacity: 0; z-index: 59; pointer-events: none;

    <script>
      const tl = gsap.timeline({ paused: true });
      gsap.set("#cam", { transformOrigin: "50% 45%", scale: 1, x: 0, y: 0 });
      // hook: punch on 15% and harder on RM30,000
      tl.to("#cam", { scale: 1.06, duration: 0.3, ease: "expo.out" }, 1.36);
      tl.to("#cam", { scale: 1.13, duration: 0.22, ease: "expo.out" }, 3.93);
      tl.to("#cam", { y: -8, duration: 0.05, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.95);
      // cut 1 (4.6): zoom-out settle + flash
      tl.fromTo("#cam", { scale: 1.2, y: 0 }, { scale: 1.0, duration: 0.5, ease: "expo.out", immediateRender: false }, 4.6);
      tl.fromTo("#flash", { opacity: 0.6 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, 4.6);
      // CCC stamp shake
      tl.to("#cam", { scale: 1.035, duration: 0.04 }, 5.78);
      tl.to("#cam", { keyframes: { y: [0, -14, 10, -6, 3, 0] }, duration: 0.28, ease: "none" }, 5.8);
      tl.to("#cam", { scale: 1.0, duration: 0.3, ease: "power2.out" }, 6.1);
      // cut 2 (6.8): horizontal whip
      tl.to("#cam", { x: -110, scale: 1.22, duration: 0.12, ease: "power3.in" }, 6.68);
      tl.set("#cam", { x: 110 }, 6.8);
      tl.to("#cam", { x: 0, scale: 1.0, duration: 0.38, ease: "expo.out" }, 6.8);
      tl.fromTo("#streak", { xPercent: -120, opacity: 0.9 }, { xPercent: 120, opacity: 0.9, duration: 0.24, ease: "power2.inOut", immediateRender: false }, 6.68);
      tl.set("#streak", { opacity: 0 }, 6.93);
      // cut 3 (8.667): hard punch-in for "Jangan lepaskan peluang"
      tl.set("#cam", { scale: 1.14 }, 8.667);
      // cut 4 (9.567): ease back out + flash
      tl.to("#cam", { scale: 1.0, duration: 0.55, ease: "expo.out" }, 9.567);
      tl.fromTo("#flash", { opacity: 0.45 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 9.567);
      // "premium": slow push while the word lands
      tl.to("#cam", { scale: 1.05, duration: 0.7, ease: "power2.out" }, 11.427);
      // cut 5 (12.833): dip cut
      tl.to("#dip", { opacity: 0.45, duration: 0.1, ease: "power1.in" }, 12.733);
      tl.set("#cam", { scale: 1.0 }, 12.833);
      tl.to("#dip", { opacity: 0, duration: 0.2, ease: "power2.out" }, 12.833);
      window.__timelines["main"] = tl;
    </script>
