<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"cta","type":"string","label":"CTA","default":"Tekan link di bio"},
    {"id":"area","type":"string","label":"Kawasan","default":"Sungai Petani"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Galeri Linen: ivory, espresso and one oxblood accent; Cormorant Garamond + Manrope. */
      :root {
        --ivory: #f5f0e8;
        --espresso: #1c1713;
        --taupe: #a39382;
        --oxblood: #7b2d26;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--espresso);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--espresso);
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 46%;
      }
      #footage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      /* Soft espresso scrims: titles live in the top band, captions in the lower band. */
      #scrim-top {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 760px;
        background: linear-gradient(
          180deg,
          rgba(22, 17, 13, 0.62) 0%,
          rgba(22, 17, 13, 0.34) 45%,
          rgba(22, 17, 13, 0) 100%
        );
      }
      #scrim-bottom {
        position: absolute;
        left: 0;
        top: 980px;
        width: 1080px;
        height: 940px;
        background: linear-gradient(
          180deg,
          rgba(22, 17, 13, 0) 0%,
          rgba(22, 17, 13, 0.5) 30%,
          rgba(22, 17, 13, 0.42) 100%
        );
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="56"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>

      <!-- Footage (cut from the phone walk-through; voice lives on #voice) -->
      <div id="cam">
        <video
          id="footage"
          class="clip"
          data-start="0"
          data-duration="53.567"
          data-track-index="0"
          src="assets/footage.mp4"
          muted
          playsinline
        ></video>
      </div>
      <div id="scrim-top" data-layout-ignore></div>
      <div id="scrim-bottom" data-layout-ignore></div>

      <!-- Scenes (graphics) -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="bawah" data-composition-id="bawah" data-composition-src="compositions/bawah.html"
        data-start="2.467" data-duration="13" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="tanah" data-composition-id="tanah" data-composition-src="compositions/tanah.html"
        data-start="15.467" data-duration="3.066" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="atas" data-composition-id="atas" data-composition-src="compositions/atas.html"
        data-start="18.533" data-duration="7.367" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="master" data-composition-id="master" data-composition-src="compositions/master.html"
        data-start="25.9" data-duration="8.633" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="bilik" data-composition-id="bilik" data-composition-src="compositions/bilik.html"
        data-start="34.533" data-duration="5.634" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="lokasi" data-composition-id="lokasi" data-composition-src="compositions/lokasi.html"
        data-start="40.167" data-duration="5.933" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="akhir" data-composition-id="akhir" data-composition-src="compositions/akhir.html"
        data-start="46.1" data-duration="9.9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- Captions -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="53.6" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920"></div>

      <!-- Voice + music -->
      <audio id="voice" class="clip" data-start="0" data-duration="53.567" data-track-index="3"
        src="assets/voice.wav" data-volume="1"></audio>
      <audio id="music" class="clip" data-start="0" data-duration="56" data-track-index="4"
        src="assets/music.mp3" data-volume="1" data-fade-out="0.6"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.2},{"t":2.3,"v":0.2},{"t":2.6,"v":0.15},{"t":53.4,"v":0.15},{"t":54.1,"v":0.42},{"t":56,"v":0.42}]}]}'></audio>

      <!-- Sound effects: every one sits on a visible action -->
      <audio id="sfx-hook" class="clip" data-start="0" data-duration="2.5" data-track-index="5" src="assets/sfx/impact-deep.mp3" data-volume="0.32" data-fade-out="0.8"></audio>
      <audio id="sfx-hk1" class="clip" data-start="0.80" data-duration="0.9" data-track-index="6" src="assets/sfx/swoosh-short.mp3" data-volume="0.16"></audio>
      <audio id="sfx-hk2" class="clip" data-start="1.60" data-duration="0.9" data-track-index="8" src="assets/sfx/swoosh-wind.mp3" data-volume="0.16"></audio>
      <audio id="sfx-in" class="clip" data-start="2.30" data-duration="1.4" data-track-index="6" src="assets/sfx/swoosh-windy.mp3" data-volume="0.22" data-fade-out="0.4"></audio>
      <audio id="sfx-tiled" class="clip" data-start="11.55" data-duration="1.2" data-track-index="6" src="assets/sfx/swoosh-wind.mp3" data-volume="0.14"></audio>
      <audio id="sfx-sembilan" class="clip" data-start="15.75" data-duration="1.2" data-track-index="6" src="assets/sfx/swoosh-short.mp3" data-volume="0.16"></audio>
      <audio id="sfx-atas" class="clip" data-start="18.45" data-duration="2.2" data-track-index="6" src="assets/sfx/air-deep.mp3" data-volume="0.26" data-fade-out="0.6"></audio>
      <audio id="sfx-p1" class="clip" data-start="23.55" data-duration="0.21" data-track-index="5" src="assets/sfx/shutter-a.mp3" data-volume="0.22"></audio>
      <audio id="sfx-p2" class="clip" data-start="23.85" data-duration="0.5" data-track-index="7" src="assets/sfx/shutter-b.mp3" data-volume="0.18"></audio>
      <audio id="sfx-p3" class="clip" data-start="24.15" data-duration="0.21" data-track-index="5" src="assets/sfx/shutter-a.mp3" data-volume="0.22"></audio>
      <audio id="sfx-balkoni" class="clip" data-start="30.40" data-duration="1.2" data-track-index="6" src="assets/sfx/swoosh-short.mp3" data-volume="0.14"></audio>
      <audio id="sfx-page" class="clip" data-start="40.10" data-duration="1.5" data-track-index="6" src="assets/sfx/swoosh-windy.mp3" data-volume="0.22" data-fade-out="0.4"></audio>
      <audio id="sfx-p4" class="clip" data-start="40.95" data-duration="0.5" data-track-index="5" src="assets/sfx/shutter-b.mp3" data-volume="0.18"></audio>
      <audio id="sfx-p5" class="clip" data-start="41.25" data-duration="0.21" data-track-index="7" src="assets/sfx/shutter-a.mp3" data-volume="0.22"></audio>
      <audio id="sfx-gal" class="clip" data-start="46.25" data-duration="1.2" data-track-index="6" src="assets/sfx/swoosh-wind.mp3" data-volume="0.16"></audio>
      <audio id="sfx-p6" class="clip" data-start="46.55" data-duration="0.21" data-track-index="5" src="assets/sfx/shutter-a.mp3" data-volume="0.2"></audio>
      <audio id="sfx-cta" class="clip" data-start="51.20" data-duration="1.0" data-track-index="6" src="assets/sfx/swoosh-short.mp3" data-volume="0.15"></audio>
      <audio id="sfx-seal" class="clip" data-start="52.25" data-duration="2.0" data-track-index="5" src="assets/sfx/impact-deep.mp3" data-volume="0.22" data-fade-out="0.8"></audio>
      <audio id="sfx-end" class="clip" data-start="53.55" data-duration="2.2" data-track-index="6" src="assets/sfx/swoosh-ending.mp3" data-volume="0.2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Hook: each flash-forward shot settles from a slow drift.
      [0, 0.867, 1.667].forEach((t) => {
        tl.set("#cam", { scale: 1.08 }, t);
        tl.to("#cam", { scale: 1.0, duration: 0.8, ease: "power2.out" }, t);
      });

      // Jump cuts inside the walk-through: alternate the framing so each cut reads as meant.
      const cuts = [4.7, 6.667, 10.133, 11.567, 13.367, 14.233, 15.467, 17.933, 18.533, 19.433,
        20.633, 23.1, 25.9, 27.233, 28.767, 29.633, 30.5, 32.833, 33.533, 34.533, 36.5, 37.533, 40.167];
      tl.set("#cam", { scale: 1.0 }, 2.467);
      cuts.forEach((t, i) => tl.set("#cam", { scale: i % 2 === 0 ? 1.045 : 1.0 }, t));

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
