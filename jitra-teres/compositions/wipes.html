<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    .wp {
      position: absolute;
      top: -200px;
      left: -260px;
      width: 1600px;
      height: 2320px;
    }
    .wp-sun { background: var(--sun); }
    .wp-ink { background: var(--ink); }
    .wp-sig { background: var(--signal); }
  </style>

  <div id="root" data-composition-id="wipes" data-width="1080" data-height="1920" data-layout-allow-overflow>
    <div class="wp wp-sun" id="wp-c1"></div><div class="wp wp-ink" id="wp-a1"></div><div class="wp wp-sig" id="wp-b1"></div>
    <div class="wp wp-sun" id="wp-c2"></div><div class="wp wp-ink" id="wp-a2"></div><div class="wp wp-sig" id="wp-b2"></div>
    <div class="wp wp-sun" id="wp-c3"></div><div class="wp wp-ink" id="wp-a3"></div><div class="wp wp-sig" id="wp-b3"></div>
    <div class="wp wp-sun" id="wp-c4"></div><div class="wp wp-ink" id="wp-a4"></div><div class="wp wp-sig" id="wp-b4"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    // chapter seams: hook→intro, porch→living room, rooms→backyard, backyard→location
    const seams = [8.167, 21.6, 44.9, 55.867];
    seams.forEach((t, i) => {
      const n = i + 1;
      const dir = i % 2 === 0 ? 1 : -1; // alternate sweep direction
      const layers = [`#wp-c${n}`, `#wp-a${n}`, `#wp-b${n}`];
      tl.set(layers, { skewX: -16 * dir, xPercent: -115 * dir }, 0);
      // three bands chase each other in, cover the cut, and peel off the other side
      layers.forEach((id, k) => {
        tl.to(id, { xPercent: 0, duration: 0.22, ease: "power3.in" }, t - 0.24 + k * 0.05);
        tl.to(id, { xPercent: 115 * dir, duration: 0.3, ease: "power3.out" }, t + 0.1 + (2 - k) * 0.05);
      });
    });
    window.__timelines["wipes"] = tl;
  </script>
</template>
