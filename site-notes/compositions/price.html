  <script>
    (function () {
      // Build the odometer columns from data-price (static markup, no timing)
      const odo = document.querySelector("#pr-odo");
      const chars = odo.dataset.price.split("");
      const strips = [];
      chars.forEach((ch) => {
        if (!/[0-9]/.test(ch)) {
          const s = document.createElement("div");
          s.className = "pr-sep";
          s.textContent = ch;
          odo.appendChild(s);
          return;
        }
        const col = document.createElement("div");
        col.className = "pr-col";
        const strip = document.createElement("div");
        strip.className = "pr-strip";
        for (let r = 0; r < 2; r++) for (let d = 0; d < 10; d++) {
          const sp = document.createElement("span");
          sp.textContent = d;
          strip.appendChild(sp);
        }
        col.appendChild(strip);
        odo.appendChild(col);
        strips.push({ el: strip, target: 10 + Number(ch) });
      });

      const tl = gsap.timeline({ paused: true });
      // Scene clock: 0 = 4.40 s in the film. "RM1,200" lands at 1.40.
      tl.fromTo(
        "#pr-note",
        { y: -60, rotation: 8, opacity: 0 },
        { y: 0, rotation: -3, opacity: 1, duration: 0.5, ease: "back.out(1.5)" },
        0.05,
      );
      strips.forEach((s, i) => {
        tl.fromTo(s.el, { y: 0 }, { y: -160 * s.target, duration: 0.95 - i * 0.08, ease: "power3.out" }, 0.5 + i * 0.05);
      });
      tl.fromTo("#pr-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.36);
      tl.fromTo("#pr-note", { scale: 1 }, { scale: 1.05, duration: 0.12, ease: "power2.out" }, 1.4);
      tl.to("#pr-note", { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.52);
      tl.fromTo("#pr-per", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 1.5);

      // "teres" — a hand-drawn arrow to the row of houses
      const line = document.querySelector("#pr-arrow-line");
      const head = document.querySelector("#pr-arrow-head");
      [line, head].forEach((p) => (p.style.strokeDasharray = p.getTotalLength()));
      tl.set([line, head], { opacity: 0 }, 0);
      tl.set(line, { opacity: 1 }, 2.32);
      tl.set(head, { opacity: 1 }, 2.74);
      tl.fromTo(line, { strokeDashoffset: line.getTotalLength() }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 2.32);
      tl.fromTo(head, { strokeDashoffset: head.getTotalLength() }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, 2.74);
      tl.fromTo("#pr-teres", { opacity: 0, scale: 0.5, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.32, ease: "back.out(2.6)" }, 2.4);
      tl.to(["#pr-arrow-line", "#pr-arrow-head", "#pr-teres"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.75);

      // Location pin at "Taman Keriang Permai"
      tl.fromTo("#pr-chip", { opacity: 0, x: -60, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 3.98);

      // Out before the cut
      tl.to(["#pr-note", "#pr-chip"], { opacity: 0, y: -30, duration: 0.2, ease: "power2.in", stagger: 0.04 }, 5.26);

      window.__timelines["price"] = tl;
    })();
  </script>
