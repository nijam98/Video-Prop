<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"price","type":"string","label":"Harga bulanan","default":"1,200"},
    {"id":"project","type":"string","label":"Nama projek","default":"Taman Keriang Permai"},
    {"id":"town","type":"string","label":"Lokasi","default":"Changlun, Kedah"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d0d0d;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: #0d0d0d;
      }
      /* Untimed wrapper: punch-ins and jump-cut reframes move this, never the video */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 46%;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Soft top + bottom shade so white type reads on a grey sky and app UI stays legible */
      #shade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(10, 12, 16, 0.42) 0%, rgba(10, 12, 16, 0.12) 22%, rgba(10, 12, 16, 0) 36%),
          linear-gradient(0deg, rgba(10, 12, 16, 0.5) 0%, rgba(10, 12, 16, 0.18) 24%, rgba(10, 12, 16, 0) 40%);
      }
      /* Cut flash: a quick paper-white blink on scene changes */
      #flash {
        position: absolute;
        inset: 0;
        background: #fff8e6;
        opacity: 0;
        pointer-events: none;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.8"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>

      <div id="cam">
        <video
          id="footage"
          class="clip"
          src="assets/video/footage.mp4"
          data-start="0"
          data-duration="21.8"
          data-track-index="0"
          muted
          playsinline
        ></video>
      </div>
      <div id="shade"></div>

      <!-- Scenes (graphics over the footage) -->
      <div
        id="hook"
        class="scene"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="price"
        class="scene"
        data-composition-id="price"
        data-composition-src="compositions/price.html"
        data-start="4.4"
        data-duration="5.52"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="status"
        class="scene"
        data-composition-id="status"
        data-composition-src="compositions/status.html"
        data-start="9.92"
        data-duration="4.78"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="cta"
        class="scene"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="14.7"
        data-duration="7.1"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="21.8"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <div id="flash"></div>

      <!-- Voice (cleaned, -15.6 LUFS) and music bed (pre-ducked under the voice) -->
      <audio id="voice" src="assets/audio/voice.wav" data-start="0" data-duration="21.8" data-volume="1" data-track-index="10"></audio>
      <audio
        id="music"
        src="assets/audio/music.wav"
        data-start="0"
        data-duration="21.8"
        data-volume="1.15"
        data-timeline-role="music"
        data-track-index="11"
      ></audio>

      <!-- Sound effects: each one sits on a visible action -->
      <audio id="sfx-impact" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="1.2" data-volume="0.08" data-fade-out="0.8" data-track-index="13"></audio>
      <audio id="sfx-circle" src="assets/sfx/whoosh-short.mp3" data-start="0.22" data-volume="0.22" data-track-index="14"></audio>
      <audio id="sfx-gauge-in" src="assets/sfx/whoosh.mp3" data-start="2.16" data-volume="0.38" data-track-index="15"></audio>
      <audio id="sfx-water" src="assets/sfx/whoosh-cinematic.mp3" data-start="2.5" data-duration="1.9" data-volume="0.22" data-fade-out="0.5" data-track-index="16"></audio>
      <audio id="sfx-sunk" src="assets/sfx/pop.mp3" data-start="3.62" data-volume="0.42" data-track-index="17"></audio>

      <audio id="sfx-cut1" src="assets/sfx/whoosh-cinematic.mp3" data-start="4.22" data-duration="1.1" data-volume="0.34" data-fade-out="0.4" data-track-index="18"></audio>
      <audio id="sfx-price-land" src="assets/sfx/pop.mp3" data-start="5.78" data-volume="0.45" data-track-index="19"></audio>
      <audio id="sfx-price-shine" src="assets/sfx/sparkle.mp3" data-start="5.82" data-volume="0.26" data-track-index="20"></audio>
      <audio id="sfx-arrow" src="assets/sfx/whoosh-short.mp3" data-start="6.72" data-volume="0.24" data-track-index="21"></audio>
      <audio id="sfx-pin" src="assets/sfx/click.mp3" data-start="8.4" data-volume="0.4" data-track-index="22"></audio>

      <audio id="sfx-cut2" src="assets/sfx/whoosh.mp3" data-start="9.8" data-volume="0.4" data-track-index="23"></audio>
      <audio id="sfx-tick1" src="assets/sfx/pop.mp3" data-start="10.26" data-volume="0.4" data-track-index="24"></audio>
      <audio id="sfx-tick2" src="assets/sfx/click-soft.mp3" data-start="11.0" data-volume="0.45" data-track-index="25"></audio>
      <audio id="sfx-tick3" src="assets/sfx/click-soft.mp3" data-start="12.14" data-volume="0.45" data-track-index="26"></audio>
      <audio id="sfx-ccc" src="assets/sfx/ping.mp3" data-start="13.8" data-volume="0.3" data-track-index="27"></audio>

      <audio id="sfx-cut3" src="assets/sfx/whoosh-cinematic.mp3" data-start="14.54" data-duration="1.1" data-volume="0.32" data-fade-out="0.4" data-track-index="28"></audio>
      <audio id="sfx-headline" src="assets/sfx/pop.mp3" data-start="16.42" data-volume="0.4" data-track-index="29"></audio>
      <audio id="sfx-caret" src="assets/sfx/whoosh-short.mp3" data-start="17.3" data-volume="0.24" data-track-index="30"></audio>
      <audio id="sfx-tap" src="assets/sfx/click.mp3" data-start="19.3" data-volume="0.5" data-track-index="31"></audio>
      <audio id="sfx-lockup" src="assets/sfx/sparkle.mp3" data-start="19.86" data-volume="0.3" data-track-index="32"></audio>
      <audio id="sfx-end" src="assets/sfx/impact-bass-2.mp3" data-start="20.95" data-volume="0.14" data-track-index="33"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#cam", { scale: 1.1 }, 0);
      tl.set("#flash", { opacity: 0 }, 0);

      // Hook: the frame is already alive at 0 — a slow push-in under the headline.
      tl.fromTo("#cam", { scale: 1.1 }, { scale: 1.02, duration: 4.3, ease: "power1.out" }, 0);

      // Jump cuts inside a sentence get a hard reframe so they read as intentional punches.
      const punch = (t, s) => tl.set("#cam", { scale: s }, t);
      punch(1.04, 1.12);
      punch(7.92, 1.1);
      punch(12.96, 1.12);
      punch(15.7, 1.12);
      punch(18.22, 1.04);
      punch(21.14, 1.1);

      // Scene cuts: zoom-settle plus a short paper flash.
      const sceneCut = (t) => {
        tl.fromTo("#cam", { scale: 1.22 }, { scale: 1.02, duration: 0.55, ease: "expo.out" }, t);
        tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.22, ease: "power2.out" }, t);
      };
      sceneCut(4.4);
      sceneCut(9.92);
      sceneCut(14.7);

      // Slow drift inside each long shot so held frames never go dead.
      tl.to("#cam", { scale: 1.08, duration: 3.0, ease: "none" }, 4.95);
      tl.to("#cam", { scale: 1.07, duration: 2.4, ease: "none" }, 10.47);
      tl.to("#cam", { scale: 1.06, duration: 2.4, ease: "none" }, 19.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
