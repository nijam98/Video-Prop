<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      --ink: #141414;
      --sun: #ffd23f;
    }
    /* Caption band: bottom of the safe area, clear of the right-hand action rail */
    .cap-band {
      position: absolute;
      left: 60px;
      top: 1150px;
      width: 840px;
      height: 200px;
      overflow: visible;
    }
    .cg {
      position: absolute;
      left: 0;
      top: 0;
      width: 840px;
      text-align: center;
      font-family: "Archivo Black", sans-serif;
      font-size: 68px;
      line-height: 1.18;
      opacity: 0;
      transform-origin: 50% 60%;
    }
    .cw {
      position: relative;
      display: inline-block;
      margin: 0 4px;
      padding: 0 8px;
    }
    .cw b {
      position: relative;
      z-index: 1;
      font-weight: 400;
      color: #ffffff;
      -webkit-text-stroke: 12px var(--ink);
      paint-order: stroke fill;
    }
    .cw.emph b {
      color: var(--sun);
    }
    /* Marker highlight that sweeps behind the spoken word */
    .cw-hl {
      position: absolute;
      left: 0;
      right: 0;
      top: 12%;
      bottom: 6%;
      background: var(--sun);
      border-radius: 10px 18px 12px 16px;
      transform: rotate(-1.5deg);
      transform-origin: 0% 50%;
      box-shadow: 4px 4px 0 var(--ink);
    }
    .cw b.act {
      position: absolute;
      z-index: 2;
      left: 8px;
      top: 0;
      color: var(--ink);
      -webkit-text-stroke: 0;
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <div class="cap-band" data-layout-allow-overlap>
<!--GROUPS-->
    </div>
  </div>

  <script>
    (function () {
      const G = /*DATA*/[];
      const tl = gsap.timeline({ paused: true });
      G.forEach((g, gi) => {
        const el = document.getElementById("cg-" + gi);
        tl.set(el, { opacity: 0, visibility: "visible" }, 0);
        tl.fromTo(el, { opacity: 0, scale: 0.86, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.14, ease: "back.out(2.2)" }, g.s);
        g.w.forEach(([ws, we], wi) => {
          const w = document.getElementById("cw-" + gi + "-" + wi);
          const hl = w.querySelector(".cw-hl");
          tl.fromTo(hl, { scaleX: 0 }, { scaleX: 1, duration: 0.09, ease: "power2.out" }, ws);
          const act = w.querySelector("b.act");
          const base = w.querySelector("b.base");
          tl.set([act, hl], { opacity: 0 }, 0);
          tl.set([act, hl], { opacity: 1 }, ws);
          tl.set(base, { opacity: 0 }, ws);
          if (wi < g.w.length - 1) {
            tl.set([act, hl], { opacity: 0 }, we);
            tl.set(base, { opacity: 1 }, we);
          }
        });
        tl.to(el, { opacity: 0, duration: 0.08, ease: "power2.in" }, g.e - 0.08);
        tl.set(el, { opacity: 0, visibility: "hidden" }, g.e);
      });
      window.__timelines["captions"] = tl;
    })();
  </script>
</template>
