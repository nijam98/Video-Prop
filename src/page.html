<title>Rumah Utara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cari rumah di Kedah dan Perlis mengikut bajet: Alor Setar, Jitra, Changlun, Sungai Petani, Gurun dan Perlis.">

<style id="ru-style">
/* Layout: sticky header, owner bar (owner only), budget picker as 5 option tiles, area chips, then a card grid of houses. Palette taken from Kedah padi fields: deep paddy green with a ripe-grain gold. */
:root {
  --bg: #f2f5ef;
  --surface: #ffffff;
  --surface-2: #e8eee3;
  --ink: #14301e;
  --muted: #586a5d;
  --line: #d5dfd0;
  --accent: #1d6a3a;
  --accent-ink: #ffffff;
  --gold: #d49b14;
  --gold-soft: #f8ecc9;
  --gold-ink: #6e4f00;
  --danger: #b3261e;
  --sky: #dcebf2;
  --sky-2: #f2f7f0;
  --ground: #9cc48a;
  --focus: #d49b14;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1611; --surface: #16211a; --surface-2: #1d2b22; --ink: #e6eee4; --muted: #9db0a1;
    --line: #2a3b30; --accent: #5cc082; --accent-ink: #0b1a10; --gold: #e8b947; --gold-soft: #3a2f12;
    --gold-ink: #f2d27e; --danger: #ff8a80; --sky: #24394a; --sky-2: #33443a; --ground: #4f7a45; --focus: #e8b947;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1611; --surface: #16211a; --surface-2: #1d2b22; --ink: #e6eee4; --muted: #9db0a1;
  --line: #2a3b30; --accent: #5cc082; --accent-ink: #0b1a10; --gold: #e8b947; --gold-soft: #3a2f12;
  --gold-ink: #f2d27e; --danger: #ff8a80; --sky: #24394a; --sky-2: #33443a; --ground: #4f7a45; --focus: #e8b947;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.55; margin: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.brand small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; line-height: 1.2; }
.saved-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.saved-btn[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); }

/* Owner bar */
.owner { background: var(--gold-soft); color: var(--gold-ink); border-bottom: 1px solid var(--line); }
.owner .wrap { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding-block: 10px; }
.owner p { margin: 0; font-size: 13px; font-weight: 600; }
.owner-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.owner-msg { flex-basis: 100%; font-size: 13px; }

/* Hero */
.hero { padding-block: 28px 8px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: clamp(28px, 6vw, 46px); font-weight: 800; line-height: 1.05; margin-top: 8px; max-width: 18ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); max-width: 58ch; margin: 12px 0 0; }
.notice {
  margin-top: 16px; display: inline-flex; gap: 8px; align-items: flex-start;
  background: var(--gold-soft); color: var(--gold-ink); border-radius: 10px;
  padding: 8px 12px; font-size: 13px; font-weight: 500;
}

/* Section labels */
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.block { padding-block: 18px 0; }

/* Budget tiles */
.budgets { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.budget {
  text-align: left; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface);
  border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; transition: border-color .15s;
}
.budget:hover { border-color: var(--accent); }
.budget .opt { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.budget .rng { font-family: var(--font-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.budget .cnt { font-size: 12.5px; color: var(--muted); }
.budget[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.budget[aria-pressed="true"] .opt, .budget[aria-pressed="true"] .cnt { color: var(--accent-ink); opacity: .85; }
.budget.all { border-style: dashed; }

/* Area chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip span { font-size: 12px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] span { color: var(--bg); opacity: .75; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding-block: 22px 12px; border-bottom: 1px solid var(--line); }
.result { font-weight: 600; }
.result b { font-family: var(--font-display); font-size: 20px; }
.selects { display: flex; gap: 8px; flex-wrap: wrap; }
.selects label { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
select, input[type="text"], input[type="number"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 14px; min-width: 0;
}

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding-block: 16px 40px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0;
  transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px rgba(20, 48, 30, .45); }
.card.is-sold .pic > svg, .card.is-sold .pic > img { filter: grayscale(.7); opacity: .75; }
.pic { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: linear-gradient(var(--sky), var(--sky-2)); }
.pic svg, .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tag {
  position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  background: var(--surface); color: var(--ink); padding: 3px 8px; border-radius: 6px;
}
.tag.new { background: var(--gold); color: #2a1d00; }
.tag.sold { background: var(--ink); color: var(--bg); }
.pcount {
  position: absolute; bottom: 8px; right: 8px; font-size: 11px; font-weight: 700;
  background: rgba(10, 20, 14, .65); color: #fff; padding: 2px 7px; border-radius: 6px;
}
.fav {
  position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%;
  border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer;
}
.fav svg { width: 18px; height: 18px; }
.fav[aria-pressed="true"] path { fill: var(--gold); stroke: var(--gold); }
.body { padding: 12px 14px 14px; display: grid; gap: 6px; flex: 1; }
.price { font-family: var(--font-display); font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; }
.monthly { font-size: 12.5px; color: var(--muted); }
.monthly b { color: var(--accent); }
.type { font-weight: 700; }
.loc { color: var(--muted); font-size: 13.5px; display: flex; gap: 4px; align-items: center; min-width: 0; }
.specs { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.badge.sample { background: var(--gold-soft); color: var(--gold-ink); }

.empty { grid-column: 1 / -1; text-align: center; padding: 40px 16px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 20px; margin-bottom: 6px; }
.empty button { margin-top: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px;
  padding: 11px 16px; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; border: 1.5px solid var(--accent);
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: default; }

/* Dialogs */
dialog {
  border: 0; padding: 0; border-radius: 18px; width: min(640px, calc(100% - 24px)); max-height: calc(100% - 24px);
  background: var(--surface); color: var(--ink); overflow: auto; overscroll-behavior: contain;
}
dialog::backdrop { background: rgba(8, 18, 12, .55); }
.d-bar { position: sticky; top: 0; height: 0; z-index: 3; display: flex; justify-content: flex-end; }
.d-close {
  margin: 10px 10px 0 0; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 22px; cursor: pointer; line-height: 1; flex: none;
}
.d-pic { aspect-ratio: 16 / 9; max-width: 100%; background: linear-gradient(var(--sky), var(--sky-2)); position: relative; }
.d-pic > svg { width: 100%; height: 100%; display: block; }
.gallery { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; }
.gallery img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
.d-hint { position: absolute; bottom: 8px; left: 10px; }
.d-body { padding: 18px 20px 22px; display: grid; gap: 16px; }
.d-head h2 { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.d-head p { margin: 4px 0 0; color: var(--muted); }
.d-desc { margin: 0; white-space: pre-line; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 0; }
.facts div { padding: 10px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.facts div:nth-child(odd) { border-right: 1px solid var(--line); }
.facts div:nth-last-child(-n+2) { border-bottom: 0; }
.facts dt { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.facts dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.loan { background: var(--surface-2); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.loan h3, .contact h3 { font-size: 16px; }
.loan-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.loan-row label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
.loan-row select { width: 100%; }
.loan-out { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.loan-out .big { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--accent); font-variant-numeric: tabular-nums; }
.loan-out small { color: var(--muted); }
.contact { display: grid; gap: 10px; }
.contact-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.phone { font-family: var(--font-display); font-weight: 800; font-size: 18px; user-select: all; }
.fine { font-size: 12px; color: var(--muted); margin: 0; }
.sold-note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-weight: 600; margin: 0; }
.d-owner { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 8px; }
.d-owner .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Editor form */
.e-body { padding: 20px; display: grid; gap: 14px; }
.e-body h2 { font-size: 22px; padding-right: 40px; }
.e-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field input[type="text"], .field input[type="number"], .field select, .field textarea { width: 100%; font-size: 16px; padding: 9px 10px; color: var(--ink); }
.field textarea { min-height: 90px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; color: var(--ink); }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.upload { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.upload .field { display: block; }
.upload input[type="file"] { display: block; width: 100%; margin-top: 6px; font-size: 14px; }
#editor { overflow-x: hidden; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.thumbs figure { margin: 0; position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs button {
  position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0;
  background: rgba(10, 20, 14, .7); color: #fff; cursor: pointer; line-height: 1;
}
.thumbs figcaption { position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 700; background: var(--gold); color: #2a1d00; padding: 1px 5px; border-radius: 4px; }
.e-err { color: var(--danger); font-size: 13.5px; font-weight: 600; margin: 0; }
.e-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

footer { border-top: 1px solid var(--line); padding-block: 22px 32px; color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 6px; max-width: 70ch; }

@media (max-width: 420px) {
  .budgets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .loan-row { grid-template-columns: 1fr 1fr; }
  .selects { width: 100%; }
  .selects label { flex: 1; }
  .selects select { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .gallery { scroll-behavior: auto; } }
</style>

<dialog id="editor" aria-labelledby="eTitle">

  const $ = id => document.getElementById(id);

  // ---------- Viewer state ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const pick = (v, allowed, d) => allowed.includes(v) ? v : d;
  const saved = store.get("ru-state", {}) || {};
  const favList = store.get("ru-favs", []);
  const state = {
    budget: pick(saved.budget, ["all", ...BUDGETS.map(b => b.id)], "all"),
    area: pick(saved.area, ["all", ...AREAS.map(a => a.id)], "all"),
    type: pick(saved.type, ["all", ...TYPES.map(t => t.id)], "all"),
    sort: pick(saved.sort, ["asc", "desc", "size", "psf", "new"], "asc"),
    savedOnly: false,
    favs: new Set(Array.isArray(favList) ? favList.filter(n => typeof n === "number") : [])
  };
  const persist = () => {
    store.set("ru-state", { budget: state.budget, area: state.area, type: state.type, sort: state.sort });
    store.set("ru-favs", [...state.favs]);
  };
  const budgetObj = () => BUDGETS.find(b => b.id === state.budget);
  const matches = (h, skip) =>
    (skip === "budget" || state.budget === "all" || inBudget(h.price, budgetObj())) &&
    (skip === "area" || state.area === "all" || h.area === state.area) &&
    (state.type === "all" || h.g === state.type) &&
    (!state.savedOnly || state.favs.has(h.id));

  function renderBudgets() {
    const pool = L.filter(h => matches(h, "budget"));
    const items = [{ id: "all", opt: "Semua", label: "Semua bajet", all: true }, ...BUDGETS];
    $("budgets").innerHTML = items.map(b => {
      const n = b.all ? pool.length : pool.filter(h => inBudget(h.price, b)).length;
      return `<button type="button" class="budget${b.all ? " all" : ""}" data-b="${b.id}" aria-pressed="${state.budget === b.id}">
        <span class="opt">${b.opt}</span><span class="rng">${b.label}</span><span class="cnt">${n} rumah</span></button>`;
    }).join("");
  }
  function renderAreas() {
    const pool = L.filter(h => matches(h, "area"));
    const items = [{ id: "all", name: "Semua kawasan" }, ...AREAS];
    $("areas").innerHTML = items.map(a => {
      const n = a.id === "all" ? pool.length : pool.filter(h => h.area === a.id).length;
      return `<button type="button" class="chip" data-a="${a.id}" aria-pressed="${state.area === a.id}">${a.name}<span>${n}</span></button>`;
    }).join("");
  }
  const heart = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
  const favLabel = on => on ? "Buang dari simpanan" : "Simpan rumah ini";

  function card(h) {
    const fav = state.favs.has(h.id);
    const tag = h.sold ? `<span class="tag sold">Terjual</span>` : `<span class="tag${h.st === "Baru" ? " new" : ""}">${statusLabel(h)}</span>`;
    return `<article class="card${h.sold ? " is-sold" : ""}" tabindex="0" data-id="${h.id}" aria-label="${esc(typeLabel(h))}, ${esc(h.loc)}, ${fmt(h.price)}${h.sold ? ", terjual" : ""}">
      <div class="pic">${coverHTML(h)}${tag}
        <button type="button" class="fav" data-fav="${h.id}" aria-pressed="${fav}" aria-label="${favLabel(fav)}">${heart}</button>
        ${h.photos.length > 1 ? `<span class="pcount">${h.photos.length} gambar</span>` : ""}
      </div>
      <div class="body">
        <div class="price">${fmt(h.price)}</div>
        <div class="monthly">Anggaran <b>${fmt(monthly(h.price))}</b>/bulan</div>
        <div class="type">${esc(typeLabel(h))}</div>
        <div class="loc"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg>${esc(h.loc)}, ${areaName(h.area)}</div>
        <div class="specs"><span>${h.bd} bilik</span><span>${h.ba} bilik air</span><span>${h.sq.toLocaleString("en-MY")} kps</span></div>
        <div class="badges">${h.sample ? '<span class="badge sample">Contoh</span>' : ""}<span class="badge">${tenureLabel(h)}</span>${h.rm ? '<span class="badge">Rizab Melayu</span>' : ""}</div>
      </div>
    </article>`;
  }

  function renderGrid() {
    const list = L.filter(h => matches(h));
    const sorters = {
      asc: (a, b) => a.price - b.price,
      desc: (a, b) => b.price - a.price,
      size: (a, b) => b.sq - a.sq,
      psf: (a, b) => a.price / a.sq - b.price / b.sq,
      new: (a, b) => b.id - a.id
    };
    list.sort((a, b) => (a.sold - b.sold) || sorters[state.sort](a, b));
    const b = budgetObj();
    const where = state.area === "all" ? "Kedah & Perlis" : areaName(state.area);
    $("result").innerHTML = `${state.savedOnly ? "Simpanan anda · " : ""}<b>${list.length}</b> rumah · ${b ? b.label : "semua bajet"} · ${where}`;
    if (!list.length) {
      const msg = state.savedOnly && !state.favs.size
        ? ["Belum ada rumah disimpan", "Tekan ♡ pada mana-mana rumah untuk simpan di sini."]
        : L.length ? ["Tiada rumah untuk pilihan ini", "Cuba julat harga lain atau kawasan berdekatan."]
        : ["Belum ada rumah disenaraikan", "Senarai rumah akan muncul di sini tidak lama lagi."];
      $("grid").innerHTML = `<div class="empty"><h3>${msg[0]}</h3><p>${msg[1]}</p>
        ${L.length ? '<button class="btn ghost" type="button" id="resetBtn">Tunjuk semua rumah</button>' : ""}</div>`;
      return;
    }
    $("grid").innerHTML = list.map(card).join("");
  }
  function renderAll() {
    renderBudgets(); renderAreas(); renderGrid();
    $("savedCount").textContent = state.favs.size;
    $("savedToggle").setAttribute("aria-pressed", state.savedOnly);
    $("typeSel").value = state.type;
    $("sortSel").value = state.sort;
    const samples = L.filter(h => h.sample).length;
    $("sampleNotice").hidden = !samples;
    if (owner.on) {
      $("clearSamples").hidden = !samples;
      $("clearSamples").textContent = `Buang ${samples} rumah contoh`;
    }
    persist();
  }

  // ---------- Detail ----------
  let current = null;
  function updateLoan() {
    if (!current) return;
    const mg = +$("lMargin").value, rt = +$("lRate").value, yr = +$("lYears").value;
    $("lMonthly").textContent = fmt(monthly(current.price, mg, rt, yr));
    $("lDown").textContent = `Wang pendahuluan ${Math.round((1 - mg) * 100)}%: ${fmt(current.price * (1 - mg))}`;
  }
  function openDetail(id) {
    const h = L.find(x => x.id === id);
    if (!h) return;
    current = h;
    if (h.photos.length) {
      $("dPic").innerHTML = `<div class="gallery" tabindex="0" aria-label="Gambar rumah">${h.photos.map((p, i) =>
        `<img src="${photoUrl(p)}" alt="Gambar ${i + 1} daripada ${h.photos.length}" data-fallback="${h.id}">`).join("")}</div>` +
        (h.photos.length > 1 ? `<span class="pcount d-hint">${h.photos.length} gambar · leret untuk lihat</span>` : "");
    } else {
      $("dPic").innerHTML = houseSVG(h);
    }
    $("dPrice").textContent = fmt(h.price);
    $("dTitle").textContent = `${typeLabel(h)} · ${h.loc}, ${areaName(h.area)} · ${ref(h)}`;
    $("dBadges").innerHTML = (h.sold ? '<span class="badge">Terjual</span>' : "") + (h.sample ? '<span class="badge sample">Contoh</span>' : "") +
      `<span class="badge">${statusLabel(h)}</span><span class="badge">${tenureLabel(h)}</span>${h.rm ? '<span class="badge">Rizab Melayu</span>' : ""}`;
    $("dDesc").textContent = h.desc;
    $("dDesc").hidden = !h.desc;
    const facts = [
      ["Bilik tidur", h.bd], ["Bilik air", h.ba],
      ["Keluasan", h.sq.toLocaleString("en-MY") + " kps"], ["Harga sekaki", "RM" + Math.round(h.price / h.sq)],
      ["Pegangan", tenureLabel(h)], ["Kawasan", areaName(h.area)]
    ];
    $("dFacts").innerHTML = facts.map(f => `<div><dt>${f[0]}</dt><dd>${esc(f[1])}</dd></div>`).join("");
    const msg = `Salam, saya berminat dengan ${typeLabel(h)} di ${h.loc}, ${areaName(h.area)} (${fmt(h.price)}, rujukan ${ref(h)}). Boleh saya dapatkan maklumat lanjut?`;
    $("dWa").href = `https://wa.me/${AGENT_PHONE}?text=${encodeURIComponent(msg)}`;
    $("dSold").hidden = !h.sold;
    $("copyMsg").textContent = "";
    $("dOwner").hidden = !owner.on;
    if (owner.on) {
      $("dSoldBtn").textContent = h.sold ? "Tanda belum terjual" : "Tanda terjual";
      disarm($("dDelete"), "Padam");
      $("dOwnerMsg").textContent = "";
    }
    updateLoan();
    const d = $("detail");
    if (!d.open) { if (typeof d.showModal === "function") d.showModal(); else d.setAttribute("open", ""); }
    d.scrollTop = 0;
  }
  const closeDlg = d => { if (d.close) d.close(); else d.removeAttribute("open"); };

  // ---------- Owner mode ----------
  const owner = { on: false, art: null, assets: null, busy: false };

  function buildDocument(listings) {
    const SC = "</scr" + "ipt>";
    const style = $("ru-style").textContent;
    const app = $("ru-app").textContent;
    const json = JSON.stringify({ v: 1, listings }).replace(/</g, "\\u003c");
    return SKELETON + "\n" + HEAD_TAGS + '\n<style id="ru-style">' + style + "</style>\n<!-" + "-BODY-->\n" +
      '<div id="ru-root"></div>\n<scr' + 'ipt type="application/json" id="ru-data">' + json + SC +
      '\n<scr' + 'ipt id="ru-app">' + app + SC + "\n\n</body></html>";
  }
  function errText(code) {
    switch (code) {
      case "conflict": return "Laman baru dikemas kini di tempat lain dan akan dimuat semula. Sila buat perubahan sekali lagi.";
      case "rate_limited": return "Terlalu kerap menyimpan. Tunggu seminit dan cuba lagi.";
      case "too_large": return "Data terlalu besar untuk disimpan.";
      case "not_writer": case "not_granted": case "capability_disabled": case "capability_removed": case "consent_required": case "not_declared":
        return "Perubahan tidak boleh disimpan dari paparan ini. Buka laman ini di claude.ai semasa log masuk sebagai pemilik.";
      default: return "Gagal menyimpan. Semak sambungan internet dan cuba lagi.";
    }
  }
  // Simpan senarai baharu: laman diterbitkan semula dan dimuat semula untuk semua orang.
  async function saveListings(next, msgEl) {
    if (owner.busy) return false;
    owner.busy = true;
    msgEl.textContent = "Menyimpan…";
    try {
      await owner.art.publish(buildDocument(next));
      msgEl.textContent = "Disimpan. Laman sedang dimuat semula…";
      L = next;
      return true;
    } catch (err) {
      msgEl.textContent = errText(err && err.code);
      return false;
    } finally {
      owner.busy = false;
    }
  }
  function arm(btn, text) { btn.classList.add("armed"); btn.dataset.armed = "1"; btn.textContent = text; clearTimeout(btn._t); btn._t = setTimeout(() => disarm(btn, btn.dataset.label), 5000); }
  function disarm(btn, label) { btn.classList.remove("armed"); delete btn.dataset.armed; if (label) { btn.dataset.label = label; btn.textContent = label; } clearTimeout(btn._t); }

  (async function initOwner() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const user = await window.claude.use("user");
      const canEdit = user ? await user.canEdit() : false;
      if (!canEdit) return;
      owner.art = await window.claude.use("artifact");
      if (!owner.art) return;
      owner.assets = await window.claude.use("assets");
      owner.on = true;
      $("owner").hidden = false;
      $("clearSamples").dataset.label = "";
      renderAll();
    } catch (e) { /* paparan pembeli biasa */ }
  })();

  // Editor
  const draft = { id: null, photos: [], fresh: new Set() };
  function openEditor(h) {
    draft.id = h ? h.id : null;
    draft.photos = h ? h.photos.slice() : [];
    draft.fresh = new Set();
    $("eTitle").textContent = h ? `Edit ${ref(h)}` : "Tambah rumah";
    $("fPrice").value = h ? h.price : "";
    $("fArea").value = h ? h.area : (state.area !== "all" ? state.area : "alorsetar");
    $("fLoc").value = h ? h.loc : "";
    $("fType").value = h ? h.g : "teres";
    $("fFloors").value = h ? String(h.f) : "1";
    $("fBed").value = h ? h.bd : 3;
    $("fBath").value = h ? h.ba : 2;
    $("fSq").value = h ? h.sq : "";
    $("fTenure").value = h ? h.tn : "B";
    $("fStatus").value = h ? h.st : "Sub-sale";
    $("fRm").checked = h ? !!h.rm : false;
    $("fDesc").value = h ? h.desc : "";
    $("fPhotos").value = "";
    $("eErr").textContent = "";
    $("upMsg").textContent = owner.assets ? "" : "Muat naik gambar tidak tersedia dalam paparan ini.";
    $("fPhotos").disabled = !owner.assets;
    $("eSave").disabled = false;
    syncFloors();
    renderThumbs();
    const d = $("editor");
    if (typeof d.showModal === "function") d.showModal(); else d.setAttribute("open", "");
    d.scrollTop = 0;
  }
  function syncFloors() {
    const flat = $("fType").value === "apt";
    $("fFloors").closest(".field").hidden = flat;
  }
  function renderThumbs() {
    $("thumbs").innerHTML = draft.photos.map((p, i) =>
      `<figure><img src="${photoUrl(p)}" alt="Gambar ${i + 1}">${i === 0 ? "<figcaption>Utama</figcaption>" : ""}
       <button type="button" data-rm="${p}" aria-label="Buang gambar ${i + 1}">×</button></figure>`).join("");
  }
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
      return blob || file;
    } catch (e) { return file; }
  }
  async function handlePhotos(files) {
    if (!owner.assets || !files.length) return;
    const room = 10 - draft.photos.length;
    const list = [...files].slice(0, Math.max(0, room));
    if (!list.length) { $("upMsg").textContent = "Maksimum 10 gambar bagi setiap rumah."; return; }
    $("eSave").disabled = true;
    let ok = 0, fail = 0;
    for (let i = 0; i < list.length; i++) {
      $("upMsg").textContent = `Memuat naik gambar ${i + 1} daripada ${list.length}…`;
      try {
        const blob = await shrink(list[i]);
        const res = await owner.assets.upload(blob, blob.type ? undefined : { type: "image/jpeg" });
        draft.photos.push(res.id); draft.fresh.add(res.id); ok++;
        renderThumbs();
      } catch (e) { fail++; }
    }
    $("upMsg").textContent = `${ok} gambar dimuat naik.` + (fail ? ` ${fail} gagal (format tidak disokong atau saiz melebihi 20MB).` : "");
    $("fPhotos").value = "";
    $("eSave").disabled = false;
  }
  async function cancelEditor() {
    closeDlg($("editor"));
    if (owner.assets) for (const id of draft.fresh) { try { await owner.assets.delete(id); } catch (e) {} }
    draft.fresh.clear();
  }
  async function submitEditor(e) {
    e.preventDefault();
    const price = Math.round(+$("fPrice").value);
    const loc = $("fLoc").value.trim();
    const sq = Math.round(+$("fSq").value);
    const bd = Math.round(+$("fBed").value), ba = Math.round(+$("fBath").value);
    const errs = [];
    if (!(price >= 10000)) errs.push("Masukkan harga (sekurang-kurangnya RM10,000).");
    if (!loc) errs.push("Masukkan nama taman atau lokasi.");
    if (!(sq >= 100)) errs.push("Masukkan keluasan dalam kaki persegi.");
    if (!(bd >= 1) || !(ba >= 1)) errs.push("Masukkan bilangan bilik tidur dan bilik air.");
    if (errs.length) { $("eErr").textContent = errs.join(" "); return; }
    const prev = draft.id ? L.find(x => x.id === draft.id) : null;
    const item = normalize({
      id: prev ? prev.id : L.reduce((m, x) => Math.max(m, x.id), 0) + 1,
      area: $("fArea").value, loc, g: $("fType").value, f: $("fType").value === "apt" ? 1 : +$("fFloors").value,
      price, bd, ba, sq, tn: $("fTenure").value, rm: $("fRm").checked, st: $("fStatus").value,
      desc: $("fDesc").value.trim(), photos: draft.photos, sold: prev ? prev.sold : 0, sample: 0
    });
    const next = prev ? L.map(x => x.id === prev.id ? item : x) : [...L, item];
    $("eSave").disabled = true;
    const done = await saveListings(next, $("eErr"));
    if (done) draft.fresh.clear(); else $("eSave").disabled = false;
  }

  // ---------- Events ----------
  $("budgets").addEventListener("click", e => {
    const b = e.target.closest("[data-b]"); if (!b) return;
    state.budget = b.dataset.b; renderAll();
  });
  $("areas").addEventListener("click", e => {
    const a = e.target.closest("[data-a]"); if (!a) return;
    state.area = a.dataset.a; renderAll();
  });
  $("typeSel").addEventListener("change", e => { state.type = e.target.value; renderAll(); });
  $("sortSel").addEventListener("change", e => { state.sort = e.target.value; renderAll(); });
  $("savedToggle").addEventListener("click", () => { state.savedOnly = !state.savedOnly; renderAll(); });
  $("grid").addEventListener("click", e => {
    if (e.target.closest("#resetBtn")) {
      Object.assign(state, { budget: "all", area: "all", type: "all", savedOnly: false }); renderAll(); return;
    }
    const f = e.target.closest("[data-fav]");
    if (f) {
      const id = +f.dataset.fav;
      const on = !state.favs.has(id);
      on ? state.favs.add(id) : state.favs.delete(id);
      if (state.savedOnly) { renderAll(); return; }
      f.setAttribute("aria-pressed", on);
      f.setAttribute("aria-label", favLabel(on));
      $("savedCount").textContent = state.favs.size;
      persist();
      return;
    }
    const c = e.target.closest(".card"); if (c) openDetail(+c.dataset.id);
  });
  $("grid").addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) { e.preventDefault(); openDetail(+e.target.dataset.id); }
  });
  // Gambar gagal dimuat: guna lakaran sebagai ganti
  document.addEventListener("error", e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || !img.dataset.fallback) return;
    const h = L.find(x => x.id === +img.dataset.fallback);
    if (!h) return;
    const gal = img.closest(".gallery");
    if (gal) { img.remove(); if (!gal.querySelector("img")) gal.parentElement.innerHTML = houseSVG(h); }
    else img.outerHTML = houseSVG(h);
  }, true);

  ["lMargin", "lRate", "lYears"].forEach(id => $(id).addEventListener("change", updateLoan));
  $("detail").addEventListener("click", e => {
    if (e.target === $("detail") || e.target.closest("[data-close]")) closeDlg($("detail"));
  });
  $("dCopy").addEventListener("click", () => {
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(document.querySelector("#detail .phone"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      $("copyMsg").textContent = "· Nombor dipilih, tekan salin";
    };
    try { navigator.clipboard.writeText(AGENT_PHONE_LABEL).then(() => { $("copyMsg").textContent = "· Disalin"; }, fallback); } catch (err) { fallback(); }
  });

  // Owner events
  $("addBtn").addEventListener("click", () => openEditor(null));
  $("clearSamples").addEventListener("click", async () => {
    const btn = $("clearSamples");
    if (!btn.dataset.armed) { btn.dataset.label = btn.textContent; arm(btn, "Tekan lagi untuk buang semua contoh"); return; }
    disarm(btn, btn.dataset.label);
    $("ownerMsg").hidden = false;
    await saveListings(L.filter(h => !h.sample), $("ownerMsg"));
  });
  $("dEdit").addEventListener("click", () => { const h = current; closeDlg($("detail")); openEditor(h); });
  $("dSoldBtn").addEventListener("click", async () => {
    if (!current) return;
    const id = current.id;
    await saveListings(L.map(x => x.id === id ? Object.assign({}, x, { sold: x.sold ? 0 : 1 }) : x), $("dOwnerMsg"));
  });
  $("dDelete").addEventListener("click", async () => {
    const btn = $("dDelete");
    if (!btn.dataset.armed) { arm(btn, "Tekan lagi untuk padam"); return; }
    disarm(btn, "Padam");
    const id = current.id;
    await saveListings(L.filter(x => x.id !== id), $("dOwnerMsg"));
  });
  $("fType").addEventListener("change", syncFloors);
  $("fPhotos").addEventListener("change", e => handlePhotos(e.target.files));
  $("thumbs").addEventListener("click", e => {
    const b = e.target.closest("[data-rm]"); if (!b) return;
    const id = b.dataset.rm;
    draft.photos = draft.photos.filter(p => p !== id);
    if (draft.fresh.has(id) && owner.assets) { draft.fresh.delete(id); owner.assets.delete(id).catch(() => {}); }
    renderThumbs();
  });
  $("eForm").addEventListener("submit", submitEditor);
  $("eCancel").addEventListener("click", cancelEditor);
  $("eClose").addEventListener("click", cancelEditor);
  $("editor").addEventListener("cancel", e => { e.preventDefault(); cancelEditor(); });

  renderAll();
})();
</script>
